version: 2

updates:
  # Go modules (backend)
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "gomod"
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend JS/TS dependencies (bun uses the npm registry ecosystem)
  - package-ecosystem: npm
    directory: /frontend/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "npm"
    ignore:
      # typescript-eslint does not support TypeScript >= 7 yet
      # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
      # Stay on the 5.x line until the lint toolchain supports the new compiler.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      js-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Dockerfile base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    groups:
      docker-images:
        patterns: ["*"]
